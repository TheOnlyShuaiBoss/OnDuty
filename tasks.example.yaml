# onduty 任务配置示例(复制为 tasks.yaml 后修改)
# 调度四选一: cron(定时) / once_at(一次性) / after(前任务完成接力) / 不写 schedule 即手动
# 适配器 flag 依据与实测结论见 plans/001_adapter_spike.md 与 plans/003_local_clients_probe.md
# ⚠ 本文件中所有 <尖括号> 都是占位符,必须替换成你机器的真实值再运行,否则 once 会报"找不到命令";
#    终端里请勿原样粘贴含 < > 的行(shell 会把 < 当重定向符)

defaults:
  timeout_minutes: 30        # 单任务超时,强杀记失败(主方案 §8)
  notify: [log, toast]       # log / toast / webhook
  catchup: false             # daemon 重启后补跑错过的 cron(主方案 §6)
  allow_danger: false        # 放权需逐 job 显式 true,且 workdir 已被强制在白名单内

scheduler:
  tick_seconds: 30           # 对账周期

notify:
  webhook_url: ""            # Server酱 / Telegram / 企业微信自建机器人
  webhook_body_template: '{"text": "[onduty] {{job}} {{status}}: {{summary}}"}'

safety:
  allow_roots:               # 强制隔离: 所有 job 的 workdir 必须落在其中之一(相对路径按本文件目录解析)
    - sandbox
    # - "<盘符>:\\专用\\沙箱\\根目录>"   # 绝对路径亦可;人肉开发目录不要放进来
  auto_git_worktree: false   # v0.2: true 时 git 仓库任务自动建隔离 worktree 跑(主目录零污染)
  # state_dir: state         # v0.2: 状态目录覆盖(默认 <配置目录>/state;多实例时分开)

agents:
  dsh:
    # 情形A: dsh 已全局安装 → 删掉 command,默认就是 ["dsh"]
    # 情形B: 从源码 checkout 跑(本机实证方式)。务必用 node 直调 argv 列表,
    #        不要用 .cmd 批处理包装——cmd 的 GBK 码页会破坏含中文/引号的 prompt(plans/001)
    command:
      - "<node.exe 路径>"                      # 例: C:\Program Files\nodejs\node.exe
      - "<DSH源码目录>\\node_modules\\tsx\\dist\\cli.mjs"
      - "--tsconfig"
      - "<DSH源码目录>\\tsconfig.json"
      - "<DSH源码目录>\\apps\\cli\\src\\bin.ts"
  codebuddy:                  # = WorkBuddy CLI。两种安装: npm @tencent-ai/codebuddy-code,
    # 或 WorkBuddy 桌面客户端内嵌 CLI(实测 plans/003):
    # command: ["<node.exe 路径>", "<WorkBuddy安装目录>\\resources\\app.asar.unpacked\\cli\\bin\\codebuddy"]
    # 一次性: 用上面命令直接运行进入 TUI,输入 /login 浏览器登录后 headless 可用
    # -p/--output-format json/--resume/-y/--model 均已本机实测
  zcode:                      # ZCode 客户端内嵌运行时或 npm 版(实测 plans/003):
    # command: ["<node.exe 路径>", "<ZCode安装目录>\\resources\\glm\\zcode.cjs"]
    # 前置: %USERPROFILE%\.zcode\cli\config.json 存在(可用 scripts/sync-zcode-cli-config.ps1
    #       从桌面配置生成)且已完成一次 login;allow_danger=false 自动用只读 --mode plan
  myagent:                    # custom 示例: 任何"命令行非交互"agent 免代码接入
    type: custom
    command: ["myagent", "--print", "{prompt}", "--resume", "{session}"]
    # session_keys: [session_id]  # stdout 为 JSON 时的会话 id 键
    # allow_args: ["--yes"]       # job.allow_danger 时追加
    # env: {MY_TOKEN: "..."}      # 任意 agent 都支持 env 追加(认证材料等放这里,勿入库)

jobs:
  # 定时: 每天 08:00 用 DSH 新开对话做汇总(DSH 无 resume,只能 new)
  - name: daily_review
    agent: dsh
    mode: new
    workdir: sandbox/daily
    prompt: 汇总本目录昨天的改动,输出 CHANGELOG 草案到 changelog_draft.md
    schedule:
      cron: "0 8 * * *"
    timeout_minutes: 20

  # 手动: onduty run fix_tests(或 --inline 直跑)
  - name: fix_tests
    agent: workbuddy
    mode: new
    workdir: sandbox/proj
    prompt: 运行测试,把失败项和原因写入 report.md
    allow_danger: true        # 无头放权(codebuddy→ -y + CODEBUDDY_IS_SANDBOX=1)

  # 接力: fix_tests 成功后自动续接同会话修第一个失败项
  - name: fix_tests_followup
    agent: workbuddy
    mode: continue            # codebuddy --resume(文档依据,装好冒烟转正)
    workdir: sandbox/proj
    prompt: |-
      上一段的结论:
      {{prev.output}}
      请按报告修复第一个失败项。
    schedule:
      after: fix_tests
      on: success             # success(默认) / always

  # DSH 链式示例: 用文本注入传递上下文(替代会话续接)
  - name: report_then_fix
    agent: dsh
    mode: new
    workdir: sandbox/proj
    prompt: |-
      上一段结论: {{prev.output}}
      基于此,把最紧迫的一个待办做完并写 done.md。
    schedule:
      after: daily_review
      on: always

  # zcode: v0.1 起内置可用(本机实测 plans/003),需在 agents.zcode.command 指到客户端运行时,
  #        且 ~/.zcode/cli/config.json 就绪(scripts/sync-zcode-cli-config.ps1 一键生成)。
  #        注意: z.ai 通道免费额度窗口为夜间 23:00–09:00;夜间任务示例:
  - name: night_zcode_review
    agent: zcode
    mode: new
    workdir: sandbox/zcode_night
    prompt: 复盘本目录今天的改动并写 night_note.md
    schedule: { cron: "5 23 * * *" }   # 每晚 23:05(踩 Z.AI 免费额度窗)
    retry: { max: 2, backoff_minutes: 10 }   # v0.2: 失败重试

  # once_at 一次性定时(v0.2): 明晚 21:30 跑一次
  - name: one_off_report
    agent: dsh
    mode: new
    workdir: sandbox/daily
    prompt: 生成一次性的项目状态快报
    schedule: { once_at: "2026-09-18 21:30" }
